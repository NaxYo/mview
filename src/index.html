<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div id="bar" role="toolbar" aria-label="View settings">
    <select id="theme" title="Theme" aria-label="Theme"></select>
    <button id="smaller" title="Smaller text (Ctrl -)" aria-label="Smaller text">A−</button>
    <button id="bigger" title="Bigger text (Ctrl +)" aria-label="Bigger text">A+</button>
    <button id="wrap" title="Switch between full-width lines and the file's own line breaks"></button>
  </div>
  <main id="doc">
    <p class="empty">Double-click a <code>.md</code> file, or drop one here.</p>
  </main>
</body>
</html>

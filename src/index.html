<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script src="themes.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header id="top" hidden>
    <nav id="tabs" role="tablist" aria-label="Open files" hidden></nav>
    <nav id="crumbs" aria-label="Followed links" hidden></nav>
  </header>

  <main id="doc"></main>

  <section id="start" hidden>
    <textarea id="paste" spellcheck="false" aria-label="Paste Markdown"
      placeholder="Paste Markdown here (Ctrl+V)&#10;&#10;…or drop a .md file on the window."></textarea>
  </section>

  <div id="menu" role="dialog" aria-label="View settings" hidden>
    <div class="row">
      <span class="label">Text size</span>
      <div class="stepper">
        <button id="smaller" aria-label="Smaller text">A−</button>
        <span id="zoomval">100%</span>
        <button id="bigger" aria-label="Bigger text">A+</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Lines</span>
      <div class="segmented" role="radiogroup" aria-label="Line layout">
        <button id="full" role="radio">Full width</button>
        <button id="breaks" role="radio">Line breaks</button>
      </div>
    </div>
    <div id="themes" role="listbox" aria-label="Theme"></div>
  </div>

  <button id="reload" hidden aria-label="Reload: the file changed" title="The file changed — reload (F5)">↻</button>
  <button id="fab" aria-label="View settings" aria-expanded="false" title="View settings">Aa</button>
</body>
</html>
